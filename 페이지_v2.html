<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화학 실험 반응물 당량 및 투입량 계산기</title>
<style>
  :root{
    --bg:#f4f7fa; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#d9e0e8;
    --accent:#0f766e; --accent-d:#0b5a54; --head:#e6f2f1; --base:#f0f9f8; --err:#d92d20; --errbg:#fff1f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.92rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .settings{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .settings label{font-weight:600}
  select,input[type=text]{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;min-width:760px;font-size:.95rem}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{background:var(--head);font-weight:700;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr.base-row td{background:var(--base)}
  td input[type=text]{width:100%;min-width:80px}
  td input.bad{border-color:var(--err);background:var(--errbg)}
  .badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
  .with-unit{display:flex;align-items:center;gap:6px}
  .with-unit span{color:var(--muted);white-space:nowrap}
  .out{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .out.err{color:var(--err);font-weight:600}
  .out.dash{color:var(--muted);font-weight:400}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 14px;color:var(--text)}
  button:hover:not(:disabled){background:#f1f5f9}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-d)!important}
  button.danger{color:var(--err)}
  button.icon{padding:5px 10px}
  .spacer{flex:1}
  .pager{display:none;align-items:center;justify-content:center;gap:12px;margin-top:14px}
  .pager.show{display:flex}
  .note{margin-top:18px;color:var(--muted);font-size:.85rem}
  .note code{background:#eef2f6;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 화학 실험 반응물 당량 및 투입량 계산기 ⚗️</h1>
  <p class="sub">기준 시약의 질량과 분자량을 입력하면 반응 시약의 투입 질량과 물질량이 자동으로 계산됩니다.</p>

  <div class="card">
    <div class="settings">
      <label for="unit">기준 물질 질량 단위</label>
      <select id="unit">
        <option value="mg">mg</option>
        <option value="g">g</option>
      </select>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>구분</th>
            <th>시약명</th>
            <th>분자량(MW)</th>
            <th>당량(eq)</th>
            <th>투입 질량</th>
            <th>물질량(mmol)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pager" id="pager">
      <button id="prev">이전</button>
      <span id="pageInfo"></span>
      <button id="next">다음</button>
    </div>

    <div class="toolbar">
      <button class="primary" id="add">반응물 추가 ➕</button>
      <button id="csv">CSV 다운로드 📄</button>
      <span class="spacer"></span>
      <button class="danger" id="reset">초기화 🔄</button>
    </div>
  </div>

  <p class="note">
    계산식: 물질량(mmol) = 질량(mg) ÷ MW · 반응 시약 물질량 = 기준 물질량 × 당량 · 투입 질량 = 물질량 × MW.
    결과는 소수점 둘째 자리까지 표시됩니다. 입력값은 이 브라우저에 자동 저장됩니다.
  </p>
</div>

<script>
(function(){
  var KEY = 'chemCalcState_v1';
  var PAGE_SIZE = 10;
  var ERR = '숫자 입력 필요';
  var TYPE_LABEL = { reagent: '반응 시약', catalyst: '촉매', solvent: '용매(mL)' };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function newRow(type){ return { id: uid(), type: type || 'reagent', name: '', mw: '', eq: '', vol: '' }; }
  function defaultState(){
    return { unit: 'mg', rows: [ { id: uid(), type: 'base', name: '', mw: '', mass: '' }, newRow() ] };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      var s = JSON.parse(raw);
      if(!s || !Array.isArray(s.rows) || !s.rows.length || s.rows[0].type !== 'base') return defaultState();
      s.unit = s.unit === 'g' ? 'g' : 'mg';
      s.rows = s.rows.map(function(r, i){
        return {
          id: String(r.id || uid()),
          type: i === 0 ? 'base' : (TYPE_LABEL[r.type] ? r.type : 'reagent'),
          name: String(r.name || ''), mw: String(r.mw || ''), eq: String(r.eq || ''),
          vol: String(r.vol || ''), mass: String(r.mass || '')
        };
      });
      return s;
    }catch(e){ return defaultState(); }
  }
  function saveState(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();
  var page = 1;
  var tbody = document.getElementById('tbody');
  var unitSel = document.getElementById('unit');

  /* ---------- 숫자 검증 ---------- */
  function parseNum(str){
    var s = String(str == null ? '' : str).trim().replace(/,/g, '');
    if(s === '') return { empty: true, ok: false };
    if(!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return { ok: false, msg: ERR };
    var n = Number(s);
    if(!(n > 0)) return { ok: false, msg: '0보다 큰 값 필요' };
    return { ok: true, n: n };
  }
  function fmt(n){ return n.toFixed(2); }
  function unitFactor(){ return state.unit === 'g' ? 1000 : 1; } // 선택 단위 → mg

  /* ---------- 계산 ---------- */
  function baseInfo(){
    var b = state.rows[0];
    var pm = parseNum(b.mass), pw = parseNum(b.mw);
    var info = { massP: pm, mwP: pw, empty: pm.empty && pw.empty, ok: pm.ok && pw.ok };
    if(info.ok){ info.mmol = (pm.n * unitFactor()) / pw.n; }
    return info;
  }

  function computeRow(r, base){
    var res = { mass: '-', mmol: '-', err: false, bad: {} };
    if(r.type === 'base'){
      if(base.empty) return res;
      if(!base.massP.ok) res.bad.mass = true;
      if(!base.mwP.ok) res.bad.mw = true;
      if(!base.ok){
        var m = (!base.massP.ok ? base.massP.msg : base.mwP.msg);
        res.mmol = m; res.err = true;
      } else {
        res.mmol = fmt(base.mmol) + ' mmol';
      }
      return res;
    }
    if(r.type === 'solvent'){
      var pv = parseNum(r.vol);
      if(pv.empty) return res;
      if(!pv.ok){ res.bad.vol = true; res.mass = pv.msg; res.err = true; return res; }
      res.mass = fmt(pv.n) + ' mL';
      return res;
    }
    var pw = parseNum(r.mw), pe = parseNum(r.eq);
    if(pw.empty && pe.empty) return res;
    if(!pw.ok || !pe.ok){
      if(!pw.ok) res.bad.mw = true;
      if(!pe.ok) res.bad.eq = true;
      var msg = !pw.ok ? pw.msg : pe.msg;
      res.mass = msg; res.mmol = msg; res.err = true;
      return res;
    }
    if(!base.ok){
      res.mass = '기준 시약 입력 필요'; res.mmol = '기준 시약 입력 필요'; res.err = true;
      return res;
    }
    var mmol = base.mmol * pe.n;
    var massMg = mmol * pw.n;
    res.mass = fmt(massMg / unitFactor()) + ' ' + state.unit;
    res.mmol = fmt(mmol) + ' mmol';
    return res;
  }

  function setOut(el, text, err){
    el.textContent = text;
    el.className = el.className.split(' ')[0] + ' out' + (err ? ' err' : (text === '-' ? ' dash' : ''));
    el.className = 'out' + (err ? ' err' : (text === '-' ? ' dash' : ''));
  }

  function updateOutputs(){
    var base = baseInfo();
    Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
      var row = state.rows.filter(function(r){ return r.id === tr.dataset.id; })[0];
      if(!row) return;
      var res = computeRow(row, base);
      var om = tr.querySelector('[data-out="mass"]');
      if(om) setOut(om, res.mass, res.err);
      var on = tr.querySelector('[data-out="mmol"]');
      if(on) setOut(on, res.mmol, res.err);
      Array.prototype.forEach.call(tr.querySelectorAll('input[data-field]'), function(inp){
        inp.classList.toggle('bad', !!res.bad[inp.dataset.field]);
      });
    });
  }

  /* ---------- 렌더링 ---------- */
  function mkInput(row, field, placeholder){
    var inp = document.createElement('input');
    inp.type = 'text';
    if(field !== 'name') inp.setAttribute('inputmode', 'decimal');
    inp.autocomplete = 'off';
    inp.placeholder = placeholder || '';
    inp.value = row[field] || '';
    inp.dataset.field = field;
    inp.addEventListener('input', function(){
      row[field] = inp.value;
      saveState();
      updateOutputs();
    });
    return inp;
  }
  function cell(child){
    var td = document.createElement('td');
    if(typeof child === 'string') td.textContent = child; else if(child) td.appendChild(child);
    return td;
  }
  function outSpan(kind){
    var s = document.createElement('span');
    s.className = 'out dash'; s.dataset.out = kind; s.textContent = '-';
    return s;
  }

  function buildRow(r){
    var tr = document.createElement('tr');
    tr.dataset.id = r.id;
    var isBase = r.type === 'base';
    if(isBase) tr.className = 'base-row';

    // 구분
    if(isBase){
      var badge = document.createElement('span');
      badge.className = 'badge'; badge.textContent = '기준 시약';
      tr.appendChild(cell(badge));
    } else {
      var sel = document.createElement('select');
      Object.keys(TYPE_LABEL).forEach(function(k){
        var o = document.createElement('option');
        o.value = k; o.textContent = TYPE_LABEL[k];
        if(k === r.type) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){
        r.type = sel.value; saveState(); render();
      });
      tr.appendChild(cell(sel));
    }

    // 시약명
    tr.appendChild(cell(mkInput(r, 'name', r.type === 'solvent' ? '용매명' : '시약명')));

    // 분자량
    if(r.type === 'solvent') tr.appendChild(cell('-'));
    else tr.appendChild(cell(mkInput(r, 'mw', 'g/mol')));

    // 당량 (용매는 부피)
    if(isBase) tr.appendChild(cell('1.00'));
    else if(r.type === 'solvent') tr.appendChild(cell(mkInput(r, 'vol', '부피(mL)')));
    else tr.appendChild(cell(mkInput(r, 'eq', 'eq')));

    // 투입 질량
    if(isBase){
      var wrap = document.createElement('div');
      wrap.className = 'with-unit';
      wrap.appendChild(mkInput(r, 'mass', '질량'));
      var u = document.createElement('span');
      u.className = 'unit-label'; u.textContent = state.unit;
      wrap.appendChild(u);
      tr.appendChild(cell(wrap));
    } else {
      tr.appendChild(cell(outSpan('mass')));
    }

    // 물질량
    tr.appendChild(cell(outSpan('mmol')));

    // 삭제
    if(isBase){
      tr.appendChild(cell(''));
    } else {
      var del = document.createElement('button');
      del.className = 'icon'; del.textContent = '행 삭제 🗑️'; del.title = '행 삭제';
      del.addEventListener('click', function(){
        state.rows = state.rows.filter(function(x){ return x.id !== r.id; });
        saveState(); render();
      });
      tr.appendChild(cell(del));
    }
    return tr;
  }

  function totalPages(){ return Math.max(1, Math.ceil(state.rows.length / PAGE_SIZE)); }

  function render(){
    var tp = totalPages();
    if(page > tp) page = tp;
    if(page < 1) page = 1;
    unitSel.value = state.unit;
    tbody.innerHTML = '';
    state.rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE).forEach(function(r){
      tbody.appendChild(buildRow(r));
    });
    var pager = document.getElementById('pager');
    pager.classList.toggle('show', state.rows.length > PAGE_SIZE);
    document.getElementById('pageInfo').textContent = page + ' / ' + tp + ' 페이지 (총 ' + state.rows.length + '행)';
    document.getElementById('prev').disabled = page <= 1;
    document.getElementById('next').disabled = page >= tp;
    updateOutputs();
  }

  /* ---------- 이벤트 ---------- */
  unitSel.addEventListener('change', function(){
    var oldF = unitFactor();
    var newUnit = unitSel.value === 'g' ? 'g' : 'mg';
    var b = state.rows[0];
    var pm = parseNum(b.mass);
    state.unit = newUnit;
    if(pm.ok){ // 입력된 질량을 같은 물리량으로 환산
      var mg = pm.n * oldF;
      var conv = mg / unitFactor();
      b.mass = String(parseFloat(conv.toPrecision(10)));
    }
    saveState(); render();
  });

  document.getElementById('add').addEventListener('click', function(){
    var r = newRow();
    state.rows.push(r);
    page = totalPages();
    saveState(); render();
    var inp = tbody.querySelector('tr[data-id="' + r.id + '"] input[data-field="name"]');
    if(inp) inp.focus();
  });

  document.getElementById('reset').addEventListener('click', function(){
    state = defaultState();
    page = 1;
    try{ localStorage.removeItem(KEY); }catch(e){}
    render();
  });

  document.getElementById('prev').addEventListener('click', function(){ if(page > 1){ page--; render(); } });
  document.getElementById('next').addEventListener('click', function(){ if(page < totalPages()){ page++; render(); } });

  document.getElementById('csv').addEventListener('click', function(){
    var base = baseInfo();
    var lines = [['구분','시약명','분자량(MW)','당량(eq)','투입 질량','물질량(mmol)']];
    state.rows.forEach(function(r){
      var res = computeRow(r, base);
      var mass = res.mass, mmol = res.mmol;
      var mw = r.mw, eq = r.eq;
      if(r.type === 'base'){
        var pm = parseNum(r.mass);
        mass = pm.ok ? fmt(pm.n) + ' ' + state.unit : (r.mass || '-');
        eq = '1.00';
      } else if(r.type === 'solvent'){
        mw = '-'; eq = '-';
      }
      lines.push([r.type === 'base' ? '기준 시약' : TYPE_LABEL[r.type], r.name, mw || '-', eq || '-', mass, mmol]);
    });
    var csv = lines.map(function(row){
      return row.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '반응물_투입량_계산.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  render();
})();
</script>
</body>
</html>
